name: Test and reproduce synthetic artifacts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and data integrity checks
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Reproduce every fixed scenario
        env:
          PYTHONPATH: src
        run: python scripts/reproduce_examples.py --output out/reproduced
      - name: Compare exact reference artifacts
        env:
          PYTHONPATH: src
        run: python scripts/verify_examples.py out/reproduced
